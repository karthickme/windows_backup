# Documented in README.md (Building the Windows executable / GitHub Actions).
name: CI

on:
  push:
    branches: [main, master, testing]
    tags: ["v*"]
  pull_request:
    branches: [testing, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

  pack:
    name: pack
    needs: test
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/testing'
      ))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Build Windows exe
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 `
            -Version "${{ steps.gitversion.outputs.semVer }}" `
            -AssemblyVersion "${{ steps.gitversion.outputs.assemblySemVer }}" `
            -InformationalVersion "${{ steps.gitversion.outputs.informationalVersion }}"

      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: FolderBackup-windows-x64
          path: dist/FolderBackup/

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: FolderBackup-${{ steps.gitversion.outputs.semVer }}-windows-x64.zip
          path: dist/FolderBackup-${{ steps.gitversion.outputs.semVer }}-windows-x64.zip

      - name: Release metadata
        id: channel
        shell: pwsh
        run: |
          $semVer = "${{ steps.gitversion.outputs.semVer }}"
          $ref = "${{ github.ref }}"
          $refName = "${{ github.ref_name }}"
          $isTag = $ref.StartsWith("refs/tags/")
          $isPrerelease = ($ref -eq "refs/heads/testing") -or
            ($semVer -like "*-*") -or
            ($isTag -and $refName.Contains("-"))
          $tagName = if ($isTag) { $refName } else { "v$semVer" }
          $title = if ($isPrerelease) { "Beta $semVer" } else { $semVer }
          $makeLatest = if ($isPrerelease) { "false" } else { "true" }
          "is_prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "make_latest=$makeLatest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.channel.outputs.tag_name }}
          name: ${{ steps.channel.outputs.title }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.channel.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.channel.outputs.make_latest }}
          files: dist/FolderBackup-${{ steps.gitversion.outputs.semVer }}-windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
